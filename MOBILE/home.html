<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cão - Área Administrativa</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }

    .container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    input[type="text"],
    input[type="password"] {
      display: block;
      width: 100%;
      max-width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ffc107;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e0a800;
    }

    .link-recuperar {
      text-align: center;
      margin-top: 15px;
    }

    .link-recuperar a {
      color: #007bff;
      text-decoration: none;
    }

    .link-recuperar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Área Administrativa</h2>
    <form id="loginForm">
      <input type="text" name="usuario" placeholder="Digite seu usuário" required>
      <input type="password" name="senha" placeholder="Digite sua senha" required>
      <button type="submit" id="submit">Acessar</button>
    </form>
    <div class="link-recuperar">
      <p><a href="recuperar-senha.html">Recuperar senha</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault(); 
      window.location.href = "menu.html"; 
    });
  </script>
</body>
</html>
